<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام | مطعم ليالي الحلمية</title>

    <!-- Font Awesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- ملفات الـ CSS مع السلاش / لضمان المسار الصحيح -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/menu.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- الهيدر وشريط التنقل -->
    <header class="main-header">
        <div class="header-container">
            <a href="/index.html" class="logo">
                <img src="/images/logo.jpg" alt="شعار ليالي الحلمية" onerror="this.src='/images/logo.jpg'">
                <span>ليالي الحلمية</span>
            </a>
            <nav class="nav-links">
                <a href="/index.html">الرئيسية</a>
                <a href="/menu.html" class="active">المنيو</a>
            </nav>
        </div>
    </header>

    <!-- قسم المنيو وقائمة الأطباق -->
    <main class="menu-page-container">
        <h1 class="page-title">قائمة الطعام</h1>

        <!-- أزرار الفلترة -->
        <div class="category-filters">
            <button class="filter-btn active" onclick="filterCategory('all')">الكل</button>
            <button class="filter-btn" onclick="filterCategory('famous')">الأكثر طلباً</button>
            <button class="filter-btn" onclick="filterCategory('مشويات')">مشويات</button>
            <button class="filter-btn" onclick="filterCategory('طواجن')">طواجن</button>
            <button class="filter-btn" onclick="filterCategory('مقبلات')">مقبلات</button>
            <button class="filter-btn" onclick="filterCategory('مشروبات')">مشروبات</button>
        </div>

        <!-- شبكة عرض الأطباق -->
        <div id="featuredGrid" class="menu-grid">
            <!-- سيتم تحميل الأطباق هنا تلقائياً بواسطة menu.js -->
        </div>
    </main>

    <!-- ملفات الـ JavaScript مع السلاش / لضمان المسار الصحيح -->
    <script src="/js/supabase-config.js"></script>
    <script src="/js/script.js" defer></script>
    <script src="/js/cart.js" defer></script>
    <script src="/js/menu.js" defer></script>

</body>
</html>
