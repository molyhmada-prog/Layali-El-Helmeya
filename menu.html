<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو الكامل | مطعم ليالي الحلمية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="menu.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- الهيدر -->
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="ليالي الحلمية" onerror="this.src='images/logo.jpg'">
                <span>ليالي الحلمية</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="menu.html" class="active">المنيو</a>
            </nav>
            <div class="header-actions">
                <button id="langToggle" class="lang-btn">EN</button>
                <div class="cart-icon-wrapper" onclick="toggleCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount" class="cart-badge">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- قائمة التصنيفات -->
    <section class="menu-page-container">
        <h1 class="page-title">قائمة المأكولات</h1>
        <div class="filter-categories">
            <button class="filter-btn active" onclick="filterCategory('all')">الكل</button>
            <button class="filter-btn" onclick="filterCategory('famous')">أشهر أطباقنا</button>
            <button class="filter-btn" onclick="filterCategory('فطير مشلتت')">فطير مشلتت</button>
            <button class="filter-btn" onclick="filterCategory('بيتزا')">بيتزا</button>
            <button class="filter-btn" onclick="filterCategory('كريب')">كريب</button>
            <button class="filter-btn" onclick="filterCategory('طواجن')">طواجن</button>
        </div>

        <!-- شبكة المنتجات -->
        <div id="menuGrid" class="menu-grid">
            <!-- المنتجات تحمّل ديناميكياً -->
        </div>
    </section>

    <!-- سلة الطلبات -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>سلة الطلبات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cartItems" class="cart-body">
            <!-- العناصر -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>الإجمالي:</span>
                <span id="cartTotal">0 د.إ</span>
            </div>
            <button onclick="checkoutWhatsApp()" class="checkout-btn"><i class="fa-brands fa-whatsapp"></i> إرسال الطلب عبر الواتساب</button>
        </div>
    </div>

    <!-- الملفات البرمجية -->
    <script src="script.js"></script>
    <script src="menu.js"></script>
    <script src="cart.js"></script>
</body>
</html>
