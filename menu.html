<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام - مطعم ليالي الحلمية</title>

    <!-- خط القاهرة وأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- ملفات التنسيق الخارجية (بدون فولدر css/) -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="ليالي الحلمية" onerror="this.src='https://via.placeholder.com/45'">
                <h2>ليالي الحلمية</h2>
            </a>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="menu.html" class="active">قائمة الطعام</a>
                <a href="cart.html" class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount">0</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- عنوان الصفحة -->
    <section class="page-banner">
        <h1>قائمة الطعام</h1>
        <p>استمتع بأشهى المأكولات والمخبوزات الفلاحية والبيتزا في مطعم ليالي الحلمية</p>
    </section>

    <!-- أزرار الأقسام والفلترة -->
    <div class="menu-filters">
        <button class="filter-btn active" onclick="filterCategory('all')">الكل</button>
        <button class="filter-btn" onclick="filterCategory('famous')">🔥 أشهر الأطباق</button>
        <button class="filter-btn" onclick="filterCategory('pizza')">🍕 البيتزا</button>
        <button class="filter-btn" onclick="filterCategory('feteer')">🫓 الفطير</button>
        <button class="filter-btn" onclick="filterCategory('tawagen')">🍲 الطواجن</button>
    </div>

    <!-- شبكة عرض كروت الطعام -->
    <main>
        <div id="featuredGrid" class="menu-grid">
            <!-- الكروت ستظهر هنا بواسطة menu.js -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 مطعم ليالي الحلمية - جميع الحقوق محفوظة</p>
    </footer>

    <!-- ملفات الجافاسكريبت الخارجية (بدون فولدر js/) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js" defer></script>
    <script src="cart.js" defer></script>
    <script src="menu.js" defer></script>

</body>
</html>
