<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام - مطعم ليالي الحلمية</title>

    <!-- خط القاهرة وأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- ملفات الـ CSS الخاصة بالموقع -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">

    <style>
        /* الثيم الداكن الأصلي للموقع */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* الهيدر العلوي */
        header.navbar {
            background-color: #1a1a1a;
            padding: 12px 25px;
            border-bottom: 1px solid #2a2a2a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e63946;
        }

        .logo h2 {
            color: #ffffff;
            font-size: 20px;
            margin: 0;
            font-weight: 700;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: #cccccc;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #e63946;
        }

        .cart-icon {
            background: #e63946;
            color: #ffffff !important;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        /* عنوان الصفحة الداكن */
        .page-banner {
            text-align: center;
            padding: 35px 20px 15px 20px;
            background-color: #121212;
        }

        .page-banner h1 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 32px;
            font-weight: 800;
        }

        .page-banner p {
            color: #aaaaaa;
            margin: 0;
            font-size: 15px;
        }

        /* أزرار الفلترة المتناسقة مع الثيم */
        .menu-filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px auto 30px auto;
            padding: 0 15px;
            max-width: 1200px;
        }

        .filter-btn {
            padding: 8px 22px;
            border: 1px solid #333333;
            background-color: #1e1e1e;
            color: #dddddd;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: #e63946;
            color: #ffffff;
            border-color: #e63946;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
        }

        /* شبكة الكروت */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
            padding: 0 20px 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #1a1a1a;
            color: #777777;
            font-size: 14px;
            border-top: 1px solid #252525;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/logo.jpg" alt="ليالي الحلمية" onerror="this.src='https://via.placeholder.com/45'">
                <h2>ليالي الحلمية</h2>
            </a>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="menu.html" class="active">قائمة الطعام</a>
                <div class="cart-icon" onclick="toggleCartDrawer && toggleCartDrawer()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount">0</span>
                </div>
            </nav>
        </div>
    </header>

    <!-- عنوان الصفحة -->
    <section class="page-banner">
        <h1>قائمة الطعام</h1>
        <p>استمتع بأشهى المأكولات والمخبوزات الفلاحية والبيتزا في مطعم ليالي الحلمية</p>
    </section>

    <!-- أزرار الأقسام والفلترة -->
    <div class="menu-filters">
        <button class="filter-btn active" onclick="filterCategory('all')">الكل</button>
        <button class="filter-btn" onclick="filterCategory('famous')">🔥 أشهر الأطباق</button>
        <button class="filter-btn" onclick="filterCategory('pizza')">🍕 البيتزا</button>
        <button class="filter-btn" onclick="filterCategory('feteer')">🫓 الفطير</button>
        <button class="filter-btn" onclick="filterCategory('tawagen')">🍲 الطواجن</button>
    </div>

    <!-- شبكة عرض كروت الطعام -->
    <main>
        <div id="featuredGrid" class="menu-grid">
            <!-- الكروت ستظهر هنا عبر الـ JavaScript -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 مطعم ليالي الحلمية - جميع الحقوق محفوظة</p>
    </footer>

    <!-- السكريبتات -->
    <!-- 1. مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. تهيئة Supabase الاحتياطية المباشرة لتجنب أي ايرور -->
    <script src="js/supabase-config.js"></script>
    <script>
        if (!window.supabaseClient && typeof supabase !== 'undefined') {
            const SUPABASE_URL = 'https://xxxx.supabase.co'; // ضعي رابط مشروعك هنا
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // ضعي مفتاحك هنا
            window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    </script>

    <!-- 3. ملفات الـ JavaScript الخاصة بالموقع -->
    <script src="js/script.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/menu.js" defer></script>

</body>
</html>
