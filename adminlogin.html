<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | لوحة التحكم - ليالي الحلمية</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>

    <style>
        :root {
            --primary: #d4af37;
            --bg: #0f0f0f;
            --card-bg: #181818;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

            .login-card img {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                border: 2px solid var(--primary);
                margin-bottom: 20px;
            }

            .login-card h2 {
                color: var(--primary);
                margin-bottom: 25px;
            }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

            .input-group label {
                display: block;
                margin-bottom: 8px;
                font-size: 0.85rem;
                color: #aaa;
            }

            .input-group input {
                width: 100%;
                padding: 12px;
                background: #222;
                border: 1px solid #444;
                color: #fff;
                border-radius: 8px;
                outline: none;
            }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1rem;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="../images/logo.jpg" alt="Logo">
        <h2>لوحة إدراة المطعم</h2>
        <form id="adminLoginForm">
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="admin@layali.com" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
            <div id="loginError" class="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();
            const errDiv = document.getElementById("loginError");

            errDiv.style.display = "none";

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                window.location.href = "index.html";
            } catch (err) {
                errDiv.innerText = "بيانات الدخول غير صحيحة. يرجى المحاولة مجدداً.";
                errDiv.style.display = "block";
            }
        });
    </script>
</body>
</html>
